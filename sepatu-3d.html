<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ClickSole 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Layout: kanvas 3D memenuhi layar, judul di kiri atas, kontrol di bawah tengah */
  :root {
    --bg: #ece5de;
    --bg-glow: #f8f4f0;
    --ink: #2b2622;
    --muted: #847a71;
    --chip: rgba(248, 244, 240, 0.8);
    --line: #d8cec4;
    --font-display: "Fraunces", Georgia, serif;
    --font-body: "Inter", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1f1b18; --bg-glow: #2e2824; --ink: #f1ebe5; --muted: #a89d93;
      --chip: rgba(46, 40, 36, 0.8); --line: #3d352f; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1f1b18; --bg-glow: #2e2824; --ink: #f1ebe5; --muted: #a89d93;
    --chip: rgba(46, 40, 36, 0.8); --line: #3d352f; color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--font-body);
    color: var(--ink);
    background: radial-gradient(ellipse at 50% 35%, var(--bg-glow), var(--bg) 70%);
    background-color: var(--bg);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .hud {
    position: fixed;
    top: env(safe-area-inset-top, 0px);
    left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
    padding-block: 20px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    pointer-events: none;
  }
  .brand { font-family: var(--font-display); font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; }
  .brand span { color: var(--muted); font-weight: 400; font-style: italic; }
  .model { margin-top: 4px; font-size: 0.85rem; color: var(--muted); }
  .badge {
    font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
    padding-top: 8px;
  }
  .controls {
    position: fixed;
    left: 50%; transform: translateX(-50%);
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
    max-width: calc(100% - 32px);
  }
  .controls button {
    font: inherit; font-size: 0.85rem; font-weight: 500;
    color: var(--ink); background: var(--chip);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 10px 16px; min-height: 40px; cursor: pointer;
    backdrop-filter: blur(8px);
    transition: transform 0.2s ease;
  }
  .controls button:hover { transform: translateY(-1px); }
  .controls button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .controls button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .hint {
    position: fixed; left: 0; right: 0;
    bottom: calc(76px + env(safe-area-inset-bottom, 0px));
    text-align: center; font-size: 0.75rem; color: var(--muted);
    pointer-events: none;
  }
  @media (prefers-reduced-motion: reduce) { .controls button { transition: none; } }
</style>
</head>
<body>
<div id="stage"></div>

<header class="hud">
  <div>
    <div class="brand">Click<span>Sole</span></div>
    <div class="model">Blue Stripes Upper + Blue Fade Sole</div>
  </div>
  <div class="badge">Model 3D · 1A</div>
</header>

<p class="hint">Seret untuk memutar · scroll atau cubit untuk zoom</p>
<div class="controls">
  <button type="button" id="btn-rotate" aria-pressed="true">Putar otomatis</button>
  <button type="button" id="btn-side">Tampak samping</button>
  <button type="button" id="btn-top">Tampak atas</button>
  <button type="button" id="btn-reset">Reset</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";

// ---------- Renderer, scene, camera ----------
const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.92;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 7;
controls.maxDistance = 40;
controls.maxPolarAngle = Math.PI * 0.62;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;

const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(6, 12, 8);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8 });
key.shadow.radius = 6;
scene.add(key);
scene.add(new THREE.HemisphereLight(0xfff8f0, 0xb8a898, 0.9));

const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: 0.18 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ---------- Profil sepatu (t: 0 = tumit, 1 = ujung jari) ----------
const L = 10;
function curve(pts, t) {
  // interpolasi Catmull-Rom pada titik (t, nilai)
  t = Math.min(1, Math.max(0, t));
  let i = 0;
  while (i < pts.length - 2 && t > pts[i + 1][0]) i++;
  const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
  const u = (t - p1[0]) / (p2[0] - p1[0]);
  const m1 = (p2[1] - p0[1]) / (p2[0] - p0[0]) * (p2[0] - p1[0]);
  const m2 = (p3[1] - p1[1]) / (p3[0] - p1[0]) * (p2[0] - p1[0]);
  const u2 = u * u, u3 = u2 * u;
  return (2 * u3 - 3 * u2 + 1) * p1[1] + (u3 - 2 * u2 + u) * m1 + (-2 * u3 + 3 * u2) * p2[1] + (u3 - u2) * m2;
}
const FOOT_W = [[0, 1.3], [0.2, 1.42], [0.5, 1.48], [0.72, 1.75], [0.88, 1.65], [1, 1.3]];
const SOLE_T = [[0, 1.45], [0.4, 1.3], [0.75, 1.1], [0.9, 0.95], [1, 0.8]];
const UPPER_H = [[0, 3.7], [0.1, 4.25], [0.3, 3.95], [0.43, 4.75], [0.53, 4.3], [0.7, 3.4], [0.85, 2.8], [1, 2.3]];

const endHeel = (t) => Math.pow(Math.max(0, Math.sin(Math.PI * t)), 0.16);
const endToe = (t) => Math.pow(Math.max(0, Math.sin(Math.PI * t)), 0.42);
const endF = (t) => (t < 0.5 ? endHeel(t) : endToe(t));
const xAt = (t) => (t - 0.5) * L;
const soleBottom = (t) => (t > 0.78 ? 0.9 * ((t - 0.78) / 0.22) ** 2 : 0) + (t < 0.06 ? 0.2 * ((0.06 - t) / 0.06) ** 2 : 0);
const soleTop = (t) => soleBottom(t) + curve(SOLE_T, t);
const footW = (t) => curve(FOOT_W, t);

// Permukaan upper: v 0..1 melintang dari dasar kiri, lewat atas, ke dasar kanan
function upperPoint(t, v) {
  const e = endF(t);
  const base = soleTop(t) - 0.05;
  const top = base + (curve(UPPER_H, t) - base) * e;
  const w = footW(t) * e;
  const th = (v - 0.5) * Math.PI;
  const s = Math.sin(th), c = Math.cos(th);
  return new THREE.Vector3(
    xAt(t),
    base + (top - base) * Math.pow(Math.abs(c), 0.7),
    w * Math.sign(s) * Math.pow(Math.abs(s), 0.9)
  );
}
function upperNormal(t, v) {
  const d = 0.002;
  const p = upperPoint(t, v);
  const du = upperPoint(Math.min(1, t + d), v).sub(upperPoint(Math.max(0, t - d), v));
  const dv = upperPoint(t, Math.min(1, v + d)).sub(upperPoint(t, Math.max(0, v - d)));
  const n = new THREE.Vector3().crossVectors(du, dv).normalize();
  const out = new THREE.Vector3(0, p.y - soleTop(t), p.z);
  if (n.dot(out) < 0) n.negate();
  return n;
}

// Membuat mesh dari grid parametrik
function gridMesh(nu, nv, pointFn, material, colorFn) {
  const pos = [], col = [], idx = [];
  for (let i = 0; i <= nu; i++) {
    for (let j = 0; j <= nv; j++) {
      const p = pointFn(i / nu, j / nv);
      pos.push(p.x, p.y, p.z);
      if (colorFn) { const c = colorFn(i / nu, j / nv, p); col.push(c.r, c.g, c.b); }
    }
  }
  for (let i = 0; i < nu; i++) {
    for (let j = 0; j < nv; j++) {
      const a = i * (nv + 1) + j, b = a + nv + 1;
      idx.push(a, b, a + 1, b, b + 1, a + 1);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  if (colorFn) g.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, material);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}
// Tempelan (panel) di atas permukaan upper: map(a,b) -> [t, v]
function patch(map, offset, material, nu = 40, nv = 12) {
  return gridMesh(nu, nv, (a, b) => {
    const [t, v] = map(a, b);
    return upperPoint(t, v).add(upperNormal(t, v).multiplyScalar(offset));
  }, material);
}
const mat = (color, opts = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.7, side: THREE.DoubleSide, ...opts });

const shoe = new THREE.Group();
shoe.name = "ClickSole_1A";

// ---------- Sol (gradasi biru) ----------
const navy = new THREE.Color("#0f3170"), sky = new THREE.Color("#8cc8ef");
const sole = gridMesh(160, 64, (t, s) => {
  const phi = s * Math.PI * 2;
  const tt = t;
  const yb = soleBottom(tt), yt = soleTop(tt);
  const cy = (yb + yt) / 2, hh = (yt - yb) / 2;
  const w = footW(tt) * 1.07 * Math.pow(Math.max(0, Math.sin(Math.PI * tt)), 0.2);
  const cp = Math.cos(phi), sp = Math.sin(phi);
  return new THREE.Vector3(
    (tt - 0.5) * L * 1.035,
    cy + hh * Math.sign(sp) * Math.pow(Math.abs(sp), 0.35),
    w * Math.sign(cp) * Math.pow(Math.abs(cp), 0.3)
  );
}, new THREE.MeshPhysicalMaterial({ vertexColors: true, roughness: 0.35, clearcoat: 0.3, clearcoatRoughness: 0.4, side: THREE.DoubleSide }),
(t, s, p) => {
  const h = (p.y - soleBottom(t)) / curve(SOLE_T, t);
  const f = Math.min(1, Math.max(0, -0.1 + 0.55 * h + 0.6 * t));
  return navy.clone().lerp(sky, f);
});
sole.name = "Sol";
shoe.add(sole);

// Lis hitam & krom di atas sol
function rim(yOff, wMul, radius, material, name) {
  const pts = [];
  const N = 90;
  for (let i = 0; i <= N; i++) { const t = 0.01 + 0.98 * i / N; pts.push(new THREE.Vector3((t - 0.5) * L * 1.03, soleTop(t) + yOff, footW(t) * wMul * Math.pow(Math.sin(Math.PI * t), 0.2))); }
  for (let i = N; i >= 0; i--) { const t = 0.01 + 0.98 * i / N; pts.push(new THREE.Vector3((t - 0.5) * L * 1.03, soleTop(t) + yOff, -footW(t) * wMul * Math.pow(Math.sin(Math.PI * t), 0.2))); }
  const m = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts, true), 400, radius, 10, true), material);
  m.name = name; m.castShadow = true;
  shoe.add(m);
}
rim(-0.08, 1.08, 0.075, new THREE.MeshStandardMaterial({ color: "#2a2b2e", roughness: 0.4, metalness: 0.3 }), "Lis_Hitam");
rim(0.06, 1.05, 0.05, new THREE.MeshStandardMaterial({ color: "#d7dadd", roughness: 0.15, metalness: 1 }), "Lis_Krom");

// ---------- Upper (kulit putih) ----------
const upper = gridMesh(160, 64, (t, v) => upperPoint(t, v), mat("#e4ddd5", { roughness: 0.9 }));
upper.name = "Upper";
shoe.add(upper);

// Pelindung tumit & ujung (krem keabuan)
const beige = mat("#cfc5bb", { roughness: 0.9 });
shoe.add(patch((a, b) => [a * (0.04 + 0.15 * Math.abs(b - 0.5) * 2), 0.03 + b * 0.94], 0.012, beige));
shoe.add(patch((a, b) => [0.86 - 0.05 * Math.abs(b - 0.5) * 2 + a * (0.14 + 0.05 * Math.abs(b - 0.5) * 2), 0.02 + b * 0.96], 0.012, beige));

// Lubang kaki + kerah empuk
const collar = mat("#cfc6bd", { roughness: 0.9 });
const opening = mat("#3b3530", { roughness: 1 });
const ell = (r, ang) => [0.2 + 0.15 * r * Math.cos(ang), 0.5 + 0.17 * r * Math.sin(ang)];
shoe.add(patch((a, b) => ell(a, b * Math.PI * 2), 0.01, opening, 16, 48));
shoe.add(patch((a, b) => ell(1 + a * 0.22, b * Math.PI * 2), 0.04, collar, 6, 64));

// Lidah sepatu + label navy
shoe.add(patch((a, b) => [0.36 + a * 0.16, 0.42 + b * 0.16], 0.03, mat("#e2dcd5")));
shoe.add(patch((a, b) => [0.4 + a * 0.05, 0.46 + b * 0.08], 0.045, mat("#1d3566", { roughness: 0.5 }), 6, 6));

// Tiga garis biru di kedua sisi
const stripeColors = ["#5d9ad6", "#3f78bf", "#1f3f7c"];
for (const side of [0, 1]) {
  stripeColors.forEach((c, k) => {
    shoe.add(patch((a, b) => {
      const v = 0.05 + b * 0.31;
      const t = 0.42 + k * 0.058 + a * 0.042 + b * 0.14;
      return [t, side ? 1 - v : v];
    }, 0.02 + k * 0.001, mat(c, { roughness: 0.55 }), 8, 24));
  });
}

// Tali sepatu bersilang
const laceMat = mat("#f4f1ec", { roughness: 0.85 });
const eyeletMat = mat("#55504b", { roughness: 0.4, metalness: 0.4 });
const rows = 6;
const lacePt = (i, v) => { const t = 0.5 + i * 0.055; return upperPoint(t, v).add(upperNormal(t, v).multiplyScalar(0.06)); };
for (let i = 0; i < rows; i++) {
  for (const v of [0.36, 0.64]) {
    const e = new THREE.Mesh(new THREE.SphereGeometry(0.07, 12, 8), eyeletMat);
    e.position.copy(lacePt(i, v));
    shoe.add(e);
  }
  const pairs = [[lacePt(i, 0.36), lacePt(i, 0.64)]];
  if (i < rows - 1) pairs.push([lacePt(i, 0.64), lacePt(i + 1, 0.36)]);
  for (const [p, q] of pairs) {
    const mid = p.clone().add(q).multiplyScalar(0.5);
    mid.y += 0.22;
    const lace = new THREE.Mesh(new THREE.TubeGeometry(new THREE.QuadraticBezierCurve3(p, mid, q), 24, 0.045, 8), laceMat);
    lace.castShadow = true;
    shoe.add(lace);
  }
}

// Lubang ventilasi di ujung
const holeMat = mat("#bfb6ad");
for (const side of [0, 1]) {
  for (let r = 0; r < 3; r++) {
    for (let k = 0; k < 4; k++) {
      const t = 0.79 + k * 0.022 + r * 0.008, v = 0.24 + r * 0.05;
      const vv = side ? 1 - v : v;
      const h = new THREE.Mesh(new THREE.CircleGeometry(0.035, 10), holeMat);
      const p = upperPoint(t, vv), n = upperNormal(t, vv);
      h.position.copy(p.add(n.clone().multiplyScalar(0.016)));
      h.lookAt(h.position.clone().add(n));
      shoe.add(h);
    }
  }
}

shoe.traverse((o) => { if (o.isMesh) o.castShadow = true; });
scene.add(shoe);

// ---------- Kamera & kontrol ----------
const views = {
  default: { pos: [4, 4.5, 13.5], target: [0, 1.9, 0] },
  side: { pos: [0, 2.2, 15], target: [0, 1.9, 0] },
  top: { pos: [0.01, 15, 0.01], target: [0, 1.5, 0] },
};
let tween = null;
const clock = new THREE.Clock();
function goTo(name) {
  const v = views[name];
  tween = { from: camera.position.clone(), to: new THREE.Vector3(...v.pos), tFrom: controls.target.clone(), tTo: new THREE.Vector3(...v.target), k: 0 };
}
function setView(name) { const v = views[name]; camera.position.set(...v.pos); controls.target.set(...v.target); }
setView("default");

const rotateBtn = document.getElementById("btn-rotate");
function setAutoRotate(on) { controls.autoRotate = on; rotateBtn.setAttribute("aria-pressed", String(on)); }
rotateBtn.addEventListener("click", () => setAutoRotate(!controls.autoRotate));
document.getElementById("btn-side").addEventListener("click", () => { setAutoRotate(false); goTo("side"); });
document.getElementById("btn-top").addEventListener("click", () => { setAutoRotate(false); goTo("top"); });
document.getElementById("btn-reset").addEventListener("click", () => goTo("default"));
controls.addEventListener("start", () => { tween = null; });
if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) setAutoRotate(false);

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w / h < 0.8 ? 55 : 35; // layar HP tegak butuh sudut lebih lebar
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);
resize();

renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  if (tween) {
    tween.k = Math.min(1, tween.k + dt / 0.8);
    const e = 1 - Math.pow(1 - tween.k, 3);
    camera.position.lerpVectors(tween.from, tween.to, e);
    controls.target.lerpVectors(tween.tFrom, tween.tTo, e);
    if (tween.k >= 1) tween = null;
  }
  controls.update();
  renderer.render(scene, camera);
});

// Ekspor ke GLB (dipakai untuk membuat file sepatu-1A.glb)
window.exportGLB = () => new Promise((resolve, reject) => {
  new GLTFExporter().parse(shoe, (buf) => {
    const bytes = new Uint8Array(buf);
    let s = "";
    for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
    resolve(btoa(s));
  }, reject, { binary: true });
});
window.__ready = true;
</script>
</body>
</html>
